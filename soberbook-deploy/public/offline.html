<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sober Book</title>
<style>
  html,body{margin:0;height:100%;background:#F7FAF8;color:#1C2320;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
  .w{min-height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:28px;box-sizing:border-box;}
  .m{width:74px;height:74px;border-radius:18px;background:#1B6B4A;color:#E8F4ED;
    display:flex;align-items:center;justify-content:center;font-size:34px;
    margin-bottom:22px;}
  h1{font-size:21px;font-weight:700;margin:0 0 10px;}
  p{font-size:15px;line-height:1.65;color:#3F4A45;margin:0 0 8px;max-width:22em;}
  .s{font-size:13px;color:#63716A;margin-top:20px;max-width:24em;}
  button{margin-top:24px;font:inherit;font-size:15px;font-weight:600;
    padding:13px 26px;border:2px solid #1B6B4A;border-radius:11px;
    background:#1B6B4A;color:#fff;min-height:44px;}
</style>
</head>
<body>
  <div class="w">
    <div class="m" aria-hidden="true">🌱</div>
    <h1>No signal right now</h1>
    <p>Sober Book needs a connection to load. Nothing is lost &mdash; whatever
       you wrote is still where you left it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="s">
      If you&rsquo;re struggling this minute and the app won&rsquo;t load,
      you can call or text <strong>988</strong> from this phone without any
      internet at all.
    </p>
  </div>
</body>
</html>
